[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-pipeline"
version = "0.1.0"
description = "Ingestion layer for an NBA data platform (NBA live-data CDN -> bronze JSON)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
transform = ["dbt-core>=1.10.5,<2.0", "dbt-duckdb>=1.9.2", "duckdb>=1.1"]
dashboard = ["streamlit>=1.38", "duckdb>=1.1", "altair>=5", "pandas>=2"]
streaming = ["kafka-python>=2.0.2", "duckdb>=1.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
nba-pipeline = "nba_pipeline.cli:main"
nba-pipeline-sample = "nba_pipeline.sample_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nba_pipeline", "tests"]
